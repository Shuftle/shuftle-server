[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
authors = ["Sebastiano Giordano"]
license = "AGPL-3.0-only"
repository = "https://github.com/shuftle/shuftle-server"
publish = false

[workspace.dependencies]
shuftle-proto = { path = "crates/shuftle-proto" }
shuftle-server = { path = "crates/shuftle-server" }
test-utils = { path = "crates/test-utils" }

# gRPC and gRPC-Web, generated from the protocol submodule without protoc.
tonic = "0.14"
tonic-web = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-reflection = "0.14"
tower-http = { version = "0.7", features = ["cors"] }
headers = "0.4"
jsonwebtoken = { version = "12", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.13", features = ["json"] }
tower-layer = "0.3"
tower-service = "0.3"
http = "1"
prost = "0.14"
prost-types = "0.14"
protox = "0.10"
semver = "1"

# Runtime.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }

# Test clients.
aws-lc-rs = "1"
base64 = "0.23"
pkcs8 = "0.11"
bytes = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http2", "tokio"] }

# Property tests.
proptest = "1"

# Command line.
clap = { version = "4", features = ["derive"] }

# Configuration file.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
url = { version = "2", features = ["serde"] }

# Errors.
anyhow = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
panic_in_result_fn = "warn"
unwrap_in_result = "warn"
todo = "warn"
float_cmp = "warn"
float_cmp_const = "warn"
cast_lossless = "warn"
cognitive_complexity = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
