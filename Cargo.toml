[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
authors = ["Sebastiano Giordano"]
license = "AGPL-3.0-only"
repository = "https://github.com/shuftle/shuftle-server"
publish = false

[workspace.dependencies]
shuftle-proto = { path = "crates/shuftle-proto" }
shuftle-server = { path = "crates/shuftle-server" }
test-utils = { path = "crates/test-utils" }

# gRPC and gRPC-Web, generated from the protocol submodule without protoc.
tonic = "0.14"
tonic-web = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-types = "0.14"
protox = "0.10"
semver = "1"

# Runtime.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }

# Errors.
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
panic_in_result_fn = "warn"
unwrap_in_result = "warn"
todo = "warn"
float_cmp = "warn"
float_cmp_const = "warn"
cast_lossless = "warn"
cognitive_complexity = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
